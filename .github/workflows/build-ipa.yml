name: Build iOS IPA

on:
  push:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/build-ipa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Unsigned Kero.ipa
    # macos-latest, unless the repository variable IOS_RUNNER names another
    # runner (as a self-hosted Mac): GitHub's images must carry an Xcode with
    # the iOS 27.1 SDK for this to build, and the job says so if they don't.
    runs-on: ${{ vars.IOS_RUNNER || 'macos-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: List the runner's Xcodes
        run: ls -d /Applications/Xcode*.app

      # The app targets the iOS 27.1 SDK: take the newest Xcode the runner
      # has, a beta too while no release has it.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Check for the iOS 27.1 SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          if [ "$(printf '%s\n27.1\n' "$sdk" | sort -V | head -1)" != "27.1" ]; then
            echo "::error::Kero for iOS needs the iOS 27.1 SDK or later; this runner's Xcode has $sdk"
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ios/build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('ios/project.yml') }}

      - name: Build unsigned IPA
        run: ios/build-ipa.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Kero-unsigned-ipa
          path: ios/build/Kero-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
